name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Git release tag
        required: true
        default: v0.1.2-alpha
        type: string
      publish:
        description: Upload to PyPI after validation
        default: false
        type: boolean

permissions: {}

concurrency:
  group: pypi-release
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'b44x/elevenlabs-agent-migrator' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate tag format
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)(\.[0-9]+)?)?$ ]]; then
            echo 'Expected a release tag such as v0.1.0-alpha.' >&2
            exit 1
          fi
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@681c641aba71e4a1c380be3ab5e12ad51f415867 # v7.1.6
        with:
          version: '0.10.2'
          enable-cache: false
      - name: Test and build release
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          uv run --locked --extra test ruff check .
          uv run --locked --extra test pytest
          uv run --locked --extra test python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          from packaging.version import Version

          project = tomllib.loads(Path("pyproject.toml").read_text())["project"]
          assert project["name"] == "elevenlabs-agent-migrator"
          assert Version(project["version"]) == Version(os.environ["RELEASE_TAG"][1:])
          PY
          uv build --no-sources
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pypi-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 5

  publish:
    if: inputs.publish
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pypi-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@76f52bc884231f62b9a034ebfe128415bbaabdfc # v1.12.4
